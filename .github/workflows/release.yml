name: Release

on:
  push:
    tags:
      - "v*"

jobs:

  release:

    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish
      run: dotnet publish VrcOscAutomator\VrcOscAutomator.csproj --configuration Release --output publish\

    - name: Upload to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: publish\VrcOscAutomator.exe
