name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: VrcOscAutomator\VrcOscAutomator.csproj
      Test_Project_Path: VrcOscAutomator.Tests\VrcOscAutomator.Tests.csproj
      # Wap_Project_Directory: your-wap-project-directory-name
      # Wap_Project_Path: your-wap-project-path

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # - name: Setup MSBuild.exe
    #   uses: microsoft/setup-msbuild@v2

    - name: Build
      run: dotnet build $env:Solution_Name --configuration $env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Execute unit tests
      run: dotnet test $env:Test_Project_Path --configuration $env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

